packages:
  - 'apps/*'
  - 'packages/*'

# Refuse packages published less than 7 days ago (value in minutes).
# Reduces exposure to broken or compromised fresh releases.
minimumReleaseAge: 10080

# Single source of truth for dependency versions. Packages reference these as "catalog:".
catalog:
  express: 5.3.0
  zod: 4.6.7
  typescript: 6.0.3
  '@types/node': 24.19.2
  '@types/express': 5.0.6
  tsx: 4.23.15
  tsdown: 0.23.7
  vitest: 5.1.0
  vite: 8.3.6
  supertest: 7.3.2
  '@types/supertest': 7.2.1
  prettier: 3.10.1
